# Compila el instalador y el paquete de la extensión en los servidores de GitHub.
#
# - Botón "Run workflow" (pestaña Actions): compila y deja los archivos para descargar,
#   sin publicar nada. Sirve para probar.
# - Al subir una etiqueta vX.Y.Z (p. ej. v1.2.0): compila y crea la Release con los archivos.
name: Compilar

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # necesario para crear la Release

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Comprobar que la etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "La etiqueta ${{ github.ref_name }} no coincide con la versión del manifest (v$version)"
          }

      - name: Descargar Java y LanguageTool
        shell: powershell
        run: .\preparar.ps1

      - name: Compilar instalador y paquete de la extensión
        shell: powershell
        run: .\instalador\construir.ps1 -Salida "$env:RUNNER_TEMP\salida"

      - name: Nombres de archivo para la descarga
        id: archivos
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\salida"
          $version = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          # Nombre fijo: el enlace .../releases/latest/download/Instalador-Corrector-Local.exe siempre da la última versión
          Rename-Item "$dir\Instalador Corrector Local.exe" "Instalador-Corrector-Local.exe"
          Rename-Item "$dir\Corrector Local $version - extension.zip" "Corrector-Local-$version-extension.zip"
          Get-ChildItem $dir | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          "dir=$dir" >> $env:GITHUB_OUTPUT

      # ---------- Firma con SignPath (solo si está configurado) ----------
      # Se activa al crear en GitHub (Settings → Secrets and variables → Actions):
      #   Secret   SIGNPATH_API_TOKEN
      #   Variable SIGNPATH_ORGANIZATION_ID   (y opcionalmente SIGNPATH_PROJECT_SLUG / SIGNPATH_POLICY_SLUG)
      # Sin ellos, el instalador se publica sin firmar, como hasta ahora.
      - name: Subir instalador para firmar
        id: sin-firmar
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: instalador-sin-firmar
          path: ${{ steps.archivos.outputs.dir }}\Instalador-Corrector-Local.exe
          retention-days: 1

      - name: Firmar con SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          connector-url: https://githubactions.connectors.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'corrector-local' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600  # hay que aprobar cada firma a mano en SignPath
          output-artifact-directory: ${{ runner.temp }}\firmado

      - name: Usar el instalador firmado
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $firmado = Get-ChildItem "$env:RUNNER_TEMP\firmado" -Recurse -Filter 'Instalador-Corrector-Local.exe' | Select-Object -First 1
          if (-not $firmado) { throw 'SignPath no devolvió el instalador firmado' }
          $sig = Get-AuthenticodeSignature $firmado.FullName
          "Firma: $($sig.Status) — $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "La firma no es válida: $($sig.StatusMessage)" }
          Copy-Item $firmado.FullName "${{ steps.archivos.outputs.dir }}\Instalador-Corrector-Local.exe" -Force

      - name: Guardar archivos (descargables desde esta ejecución)
        uses: actions/upload-artifact@v7
        with:
          name: corrector-local
          path: ${{ steps.archivos.outputs.dir }}
          retention-days: 14

      - name: Crear la Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "${{ steps.archivos.outputs.dir }}"
          $notas = @"
          **Instalación:** descarga ``Instalador-Corrector-Local.exe``, ejecútalo y sigue los pasos. Al final añade la extensión a Edge o Chrome (el instalador te guía).

          - Corrector ortográfico y gramatical que funciona 100 % en tu PC
          - Extensión para Edge y Chrome: subrayado en tiempo real y sugerencias con un clic
          - Sin cuentas, sin suscripciones, sin enviar texto a internet

          El archivo ``Corrector-Local-*-extension.zip`` es el paquete de la extensión (para las tiendas o para cargarla en modo desarrollador).

          Cambios: ver [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

          "@
          if ('${{ vars.SIGNPATH_ORGANIZATION_ID }}') {
            $notas += "`nInstalador firmado digitalmente. Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org)."
          } else {
            $notas += "`nSi Windows muestra `"Windows protegió su PC`": Más información → Ejecutar de todas formas (el instalador aún no tiene firma digital)."
          }
          gh release create "${{ github.ref_name }}" (Get-ChildItem $dir).FullName `
            --title "Corrector Local ${{ github.ref_name }}" --notes $notas
