<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Corrector Local</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #1c1d1f; --muted: #6b6f76; --line: #e6e7ea;
      --ok: #16a34a; --bad: #dc2626; --accent: #2563eb; --field: #f5f6f8;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --line: #3c4043;
              --ok: #4ade80; --bad: #f87171; --accent: #8ab4f8; --field: #2a2b2e; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; width: 300px; background: var(--bg); color: var(--fg);
           font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    header img { width: 22px; height: 22px; }
    header h1 { font-size: 14px; margin: 0; flex: 1; }
    section { padding: 10px 14px; border-bottom: 1px solid var(--line); }
    section:last-child { border-bottom: 0; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .status { display: flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
    .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
    label { font-weight: 600; }
    select, input[type=text] { width: 100%; margin-top: 4px; padding: 6px 8px; border: 1px solid var(--line);
      border-radius: 6px; background: var(--field); color: var(--fg); font: inherit; }
    .switch { position: relative; width: 36px; height: 20px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; border-radius: 20px; background: var(--line); cursor: pointer; transition: .15s; }
    .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px;
      border-radius: 50%; background: #fff; transition: .15s; }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(16px); }
    ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 120px; overflow: auto; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; }
    li button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; }
    li button:hover { color: var(--bad); }
    .empty { color: var(--muted); font-style: italic; }
    footer { padding: 8px 14px; border-top: 1px solid var(--line); text-align: center;
             color: var(--muted); font-size: 11px; }
    footer strong { color: var(--fg); font-weight: 600; }
    .update { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .update a { color: var(--accent); font-weight: 600; margin-left: 4px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/48.png" alt="">
    <h1>Corrector Local</h1>
    <label class="switch" title="Activar o desactivar">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <section>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Comprobando servidor…</span></div>
    <div class="hint" id="statusHint"></div>
  </section>

  <section class="update" id="update" hidden>
    Hay una versión nueva: <strong id="updateVersion"></strong>
    <a id="updateLink" target="_blank" rel="noopener">Descargar</a>
  </section>

  <section>
    <label for="language">Idioma</label>
    <select id="language">
      <option value="es">Español</option>
      <option value="es-AR">Español (voseo)</option>
      <option value="en-US">Inglés (EE. UU.)</option>
      <option value="pt-BR">Portugués (Brasil)</option>
      <option value="auto">Detectar automáticamente</option>
    </select>
  </section>

  <section>
    <label>Mi diccionario</label>
    <ul id="dict"></ul>
  </section>

  <section>
    <label for="server">Servidor</label>
    <input type="text" id="server" spellcheck="false">
  </section>

  <footer>Desarrollado por <strong>Daniel</strong> · v<span id="version"></span></footer>

  <script src="popup.js"></script>
</body>
</html>
